<title>목록형 견본</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="artifact-style" content="1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 문서형은 720px 한 단에 단락 카드, 목록형은 1120px 카드 격자. 색과 글꼴은 아래 토큰만 사용 */
:root{
  --bg:#f6f5f1; --card:#ffffff; --fg:#1d1f24; --muted:#5d626d; --line:#e2e0d8; --soft:#efede7;
  --accent:#d6402b; --accent-soft:#fbe3dd; --on-accent:#ffffff; --mark:#ffe873;
  --good:#1f7a4d; --good-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fdf0d5;
  --display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171b; --card:#1e2127; --fg:#eceae4; --muted:#a3a7b0; --line:#30343c; --soft:#262a31;
  --accent:#ff7a63; --accent-soft:#3a201c; --on-accent:#1d1f24; --mark:#6b5a00;
  --good:#5fd49a; --good-soft:#163326; --warn:#f2b860; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1e2127; --fg:#eceae4; --muted:#a3a7b0; --line:#30343c; --soft:#262a31;
  --accent:#ff7a63; --accent-soft:#3a201c; --on-accent:#1d1f24; --mark:#6b5a00;
  --good:#5fd49a; --good-soft:#163326; --warn:#f2b860; --warn-soft:#33270f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 80px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1120px;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,7vw,52px)}
h2{font-size:clamp(26px,5vw,34px)}
h3{font-size:21px}
p{margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.muted{color:var(--muted);font-size:15px}
.intro{font-size:18px;line-height:1.7}

/* 머리 */
header{display:flex;flex-direction:column;gap:12px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font-size:14px;font-weight:500;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px}
nav a:hover,nav a:focus-visible{border-color:var(--accent);outline:none}

/* 단락 카드와 1분 요약 */
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px;min-width:0}
.hero{background:var(--accent);color:var(--on-accent);border:0}
.hero .eyebrow{color:var(--on-accent);opacity:.85}
.hero ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:19px;font-weight:700}
.hero p{font-size:16px;opacity:.92}
.hero mark{color:var(--fg)}

/* 블록 */
.answer{font-size:20px;font-weight:700;line-height:1.6}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.pts li{padding-left:22px;position:relative}
ul.pts li::before{content:"";position:absolute;left:4px;top:.72em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.box{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box.red{background:var(--accent-soft)} .box.red b{color:var(--accent)}
.box.warn{background:var(--warn-soft)} .box.warn b{color:var(--warn)}
.box.good{background:var(--good-soft)} .box.good b{color:var(--good)}
details{border-top:1px solid var(--line);padding-top:12px}
details>div{display:flex;flex-direction:column;gap:12px}
summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:15px}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
details[open] summary{margin-bottom:12px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.num{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num strong{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.num small{font-size:14px;color:var(--muted);line-height:1.5}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--display);font-size:22px;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.formula{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f{border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.f b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent)}
.f span{font-size:15px;line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;line-height:1.55}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:700;font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.chk{background:var(--warn-soft);color:var(--warn)}
.tag.no{background:var(--accent-soft);color:var(--accent)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.meter-track i{display:block;height:100%;background:var(--accent)}
.meter small{font-size:14px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:15px;line-height:1.55}
.rank-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--accent)}
pre{font-family:var(--mono);font-size:14px;background:var(--soft);padding:12px 14px;border-radius:10px;overflow-x:auto;margin:0;line-height:1.6}
pre code{background:none;padding:0;font-size:inherit}
.check{display:flex;flex-direction:column;gap:10px}
.check label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:10px 12px;border-radius:10px;background:var(--bg)}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.check input:checked + span{text-decoration:line-through;color:var(--muted)}
.copy-list{display:flex;flex-direction:column;gap:10px}
.copy-item{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.copy-item>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.copy-item small{color:var(--muted);font-size:13px}
.copy-item q{quotes:none;font-weight:500;font-size:16px}
.copy-btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 목록형 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sum b{display:block;font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar input{flex:1;min-width:0;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font:inherit;font-size:15px}
.group{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.group-title{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:6px}
.group-title small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.card-name{font-family:var(--mono);font-weight:600;font-size:15px;margin-right:2px;overflow-wrap:anywhere}
.card-one{font-size:15px;line-height:1.6}
.b{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:700;white-space:nowrap}
.b.accent{color:var(--accent);border-color:var(--accent)}
.b.line{color:var(--fg);border-color:var(--line)}
.b.ok{background:var(--good-soft);color:var(--good)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.new{background:var(--accent);color:var(--on-accent)}
dl.info{margin:0;display:grid;grid-template-columns:64px 1fr;gap:7px 10px;font-size:14px;line-height:1.6}
dl.info dt{color:var(--muted);font-size:13px}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.card-links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.empty{color:var(--muted);padding:20px 0}

footer{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap wide">

<header>
<span class="eyebrow">artifact-style 목록형 견본</span>
<h1>도구 모음 견본</h1>
<p class="intro">이 페이지가 무엇이고 누가 읽으면 좋은지 한두 문장. 링크만 받은 사람도 바로 알 수 있게</p>
<p class="muted">카드를 검색해서 찾는 페이지</p>
</header>

<div class="summary"><div class="sum"><b>3</b><span>전체 항목</span></div><div class="sum"><b>1</b><span>새 항목</span></div></div>

<div class="bar" role="search"><input id="q" type="search" placeholder="이름이나 쓰임으로 찾기 (예: 자막)" aria-label="찾기"></div>

<div class="group"><div class="group-title"><h2>만들기</h2><small>2개</small></div><div class="cards"><article class="card"><div class="card-top"><span class="card-name">sample-tool</span><span class="b new">NEW</span><span class="b accent">직접 만듦</span><span class="b ok">상업 가능</span></div><p class="card-one">한 줄 설명. 언제 쓰는지 쉽게</p><dl class="info"><dt>언제</dt><dd>이럴 때 써요</dd><dt>사용법</dt><dd><code>/sample-tool 주제</code></dd></dl><div class="card-links"><a href="https://claude.ai" target="_blank" rel="noopener">받는 곳</a></div></article><article class="card"><div class="card-top"><span class="card-name">other-tool</span><span class="b line">외부</span><span class="b warn">조건부</span></div><p class="card-one">한 줄 설명</p></article></div></div><div class="group"><div class="group-title"><h2>검수</h2><small>1개</small></div><div class="cards"><article class="card"><div class="card-top"><span class="card-name">check-tool</span></div><p class="card-one">한 줄 설명</p></article></div></div>

<p class="empty" id="empty" hidden>찾는 항목이 없어요. 검색어를 바꿔 보세요.</p>

<footer><span>출처와 기준 날짜</span></footer>

</div>

<script>
(function(){
  var q=document.getElementById('q'), empty=document.getElementById('empty');
  q.addEventListener('input',function(){
    var w=q.value.trim().toLowerCase(), any=false;
    document.querySelectorAll('.group').forEach(function(g){
      var n=0;
      g.querySelectorAll('.card').forEach(function(c){ var hit=!w||c.textContent.toLowerCase().indexOf(w)>=0; c.hidden=!hit; if(hit)n++; });
      g.hidden=n===0; if(n)any=true;
    });
    empty.hidden=any;
  });
})();
</script>
